<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京都行程景點地圖（電視版）</title>
<link rel="stylesheet" href="tv.css">
<meta name="theme-color" content="#b5482b">
</head>
<body>
  <!-- 電視盒（Android TV，例如小米盒子 S）專用：只用遙控器的上下左右、OK、返回就能操作，只能看不能改 -->
  <header class="tv-top">
    <h1>京都行程景點地圖 <span class="tv-badge">電視版</span></h1>
    <div class="tv-hint" id="tvHint">↑↓ 選擇　← → 換欄　OK 確定　返回鍵 回上一層</div>
  </header>

  <main class="tv-main">
    <nav class="tv-col tv-nav" id="tvNav" aria-label="選單"></nav>
    <section class="tv-col tv-list" id="tvList" aria-label="清單"></section>
    <article class="tv-col tv-detail" id="tvDetail" aria-label="介紹"></article>
  </main>

  <div class="tv-status" id="tvStatus"></div>

  <div class="tv-map-overlay" id="tvMapOverlay" hidden>
    <div class="tv-map-head">
      <span id="tvMapTitle"></span>
      <span class="tv-hint">手機上改選點，這裡會自動更新　↑↓←→ 移動　OK 放大　返回鍵 關閉</span>
    </div>
    <div class="tv-map-body">
      <div id="tvMap"></div>
      <ol class="tv-map-list" id="tvMapList"></ol>
    </div>
    <div class="tv-map-msg" id="tvMapMsg" hidden></div>
  </div>

  <!-- logger.js 一定要排第一個，後面任何檔案出錯才記得到 -->
  <script src="logger.js"></script>
  <script src="data.js"></script>
  <script src="tv.js"></script>
</body>
</html>
