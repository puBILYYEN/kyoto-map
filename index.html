<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京都行程景點地圖</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b5482b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div id="app" data-mview="list" data-detail="closed">
    <header class="topbar">
      <div class="topbar-row">
        <h1>京都行程景點地圖</h1>
        <div class="topbar-actions">
          <button type="button" class="prep-btn prep-btn-primary" id="chatBtn">🧭 線上導遊</button>
          <button type="button" class="prep-btn" id="phraseBtn">💬 日語小抄</button>
          <button type="button" class="prep-btn" id="prepBtn">🛂 行前準備</button>
          <button type="button" class="prep-btn" id="taxBtn">🧾 退稅小幫手</button>
        </div>
      </div>
      <p class="subtitle">依分類瀏覽 · 點景點看詳細介紹 · 勾選多個景點可開啟大眾運輸路線</p>
    </header>

    <div class="offline-bar" id="offlineBar" hidden>
      📴 目前沒有網路。景點資料、日語小抄、行前準備、退稅小幫手仍可正常使用；地圖與線上導遊需要連線。
    </div>

    <div class="main">
      <aside class="sidebar">
        <div class="tabs" id="tabs"></div>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜尋景點名稱或地區…">
          <label class="filter-toggle">
            <input type="checkbox" id="bookingOnly">
            只看需要預約／申請的景點
          </label>
        </div>
        <div class="spot-list" id="spotList"></div>

        <div class="selection-box" id="selectionBox">
          <h3>已選景點 <span id="selCount">(0)</span></h3>
          <ol id="selectedList"></ol>
          <div id="routeButtons"></div>
          <div class="share-row">
            <button type="button" id="shareLinkBtn" class="share-btn share-btn-primary">🔗 用連結分享</button>
          </div>
          <div class="member-box" id="memberBox">
            <div class="member-me" id="memberMe"></div>
            <div class="member-others" id="memberOthers"></div>
          </div>

          <div class="joint-box" id="jointBox">
            <h4>🧭 共同選點</h4>
            <div id="jointList"></div>
            <button type="button" id="memberLogBtn" class="share-btn" style="margin-top:6px;">🔍 查看跳棋同步記錄</button>
            <div id="memberLogPanel" class="member-log-panel" hidden></div>
          </div>

          <button id="clearSelection" class="clear-btn">清除選取</button>
        </div>
      </aside>

      <main class="map-area">
        <div id="map"></div>
        <div class="map-hint" id="mapHint" hidden></div>
        <div class="detail-panel" id="detailPanel">
          <div class="detail-actions">
            <button type="button" class="detail-tomap" id="detailToMap">🗺 看地圖</button>
            <button type="button" class="detail-close" id="detailClose" aria-label="關閉">✕</button>
          </div>
          <div class="detail-body" id="detailBody">
            <div class="detail-placeholder">點選左側清單或地圖上的標記，查看景點詳細介紹</div>
          </div>
        </div>
      </main>
    </div>

    <div class="chat-overlay" id="chatOverlay" hidden>
      <div class="chat-box">
        <header class="chat-head">
          <span class="chat-title">🧭 京都線上導遊</span>
          <button type="button" id="chatClose" aria-label="關閉">✕</button>
        </header>
        <div class="chat-msgs" id="chatMsgs"></div>
        <div class="chat-suggest" id="chatSuggest"></div>
        <form class="chat-input" id="chatForm">
          <input type="text" id="chatText" placeholder="問我任何關於京都的事…" autocomplete="off">
          <button type="submit" id="chatSend">送出</button>
        </form>
      </div>
    </div>

    <div class="ask-overlay" id="askOverlay" hidden>
      <div class="ask-box">
        <header class="ask-head">
          <span class="ask-title">🗣️ 問路小工具</span>
          <button type="button" id="askClose" aria-label="關閉">✕</button>
        </header>
        <div class="ask-body" id="askBody"></div>
      </div>
    </div>

    <div class="share-overlay" id="shareOverlay" hidden>
      <div class="share-box">
        <header class="share-head">
          <span class="share-title">☁️ 共享清單</span>
          <button type="button" id="shareClose" aria-label="關閉">✕</button>
        </header>
        <div class="share-body" id="shareBody"></div>
      </div>
    </div>

    <nav class="mobile-nav" id="mobileNav">
      <button type="button" data-mview="list" class="active">📋 景點清單</button>
      <button type="button" data-mview="map">🗺 地圖</button>
      <button type="button" data-mview="sel">✅ 已選 (0)</button>
    </nav>
  </div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="data.js"></script>
  <script src="kyoto-border.js"></script>
  <script src="app.js"></script>
</body>
</html>
